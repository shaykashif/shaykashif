  <style>
    .windows {
      list-style: none; display: grid; gap: 12px;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      margin-top: 8px;
    }
    .window { display: block; color: var(--fg); text-decoration: none; }
    .arch {
      position: relative; aspect-ratio: 4 / 5;
      background: var(--line); overflow: hidden;
    }
    .arch img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .8s ease; }
    .window:hover .arch img { transform: scale(1.04); }
    .develop .arch img { opacity: 0; transform: translateY(8px); filter: grayscale(1) contrast(1.8) brightness(1.35); transition: opacity .55s steps(10, end), transform .55s steps(8, end), filter .9s steps(12, end); }
    .develop .arch img.shown { opacity: 1; transform: none; filter: none; }
    .develop .window:hover .arch img.shown { transform: scale(1.04); }
    @media (max-width: 520px) { .windows { grid-template-columns: repeat(2, 1fr); gap: 12px; } }
  </style>
</head>
<body class="page-photos">

  <main>
    <header class="top">
      <a href="/">&larr; Shay Kashif</a>
      <strong>Photos <span>90</span></strong>
    </header>

    <ul class="windows">
      <li>
        <a class="window" href="/gallery-kreuzberg">
          <div class="arch"><img src="https://photos.shaykas.com/Kreuzberg/thumb/IMG_1104.webp" width="720" height="900" alt="Cover photo for Golden Hour: Kreuzberg" fetchpriority="high" decoding="async" /></div>
        </a>
      </li>
      <li>
        <a class="window" href="/gallery-hyde-park">
          <div class="arch"><img src="https://photos.shaykas.com/HydePark/thumb/00270005.webp" width="720" height="900" alt="Cover photo for Hyde Park, London" fetchpriority="high" decoding="async" /></div>
        </a>
      </li>
      <li>
        <a class="window" href="/gallery-winter-pea">
          <div class="arch"><img src="https://photos.shaykas.com/WinterPEA/thumb/R1-03816-027A.webp" width="720" height="900" alt="Cover photo for Winter at Exeter" loading="lazy" decoding="async" /></div>
        </a>
      </li>
      <li>
        <a class="window" href="/gallery-pea-fall">
          <div class="arch"><img src="https://photos.shaykas.com/PEA%20Fall/thumb/R1-00671-030A.webp" width="720" height="900" alt="Cover photo for PEA Fall" loading="lazy" decoding="async" /></div>
        </a>

        <a class="window" href="/gallery-sf-marin">
          <div class="arch"><img src="https://photos.shaykas.com/SF%20Marin/thumb/R1-03816-003A.webp" width="720" height="900" alt="Cover photo for SF &amp; Marin" loading="lazy" decoding="async" /></div>
        </a>
      </li>
      <li>
        <a class="window" href="/gallery-yosemite">
          <div class="arch"><img src="https://photos.shaykas.com/Yosemite%20and%20Summer/thumb/R1-00671-003A.webp" width="720" height="900" alt="Cover photo for Yosemite &amp; Summer" loading="lazy" decoding="async" /></div>
        </a>
      </li>
    </ul>
  </main>
  <script>
  // Windows materialize as the page loads, in a wave from the top-left; ones
  // further down do the same as they scroll into view.
  (function () {
    var root = document.documentElement;
    if (!root.classList.contains('develop')) return;
    try {
      var GAP_MS = 45, queue = [], busy = false;

      function show(img) { img.classList.add('shown'); }

      function pump() {
        if (busy || !queue.length) return;
        busy = true;
        show(queue.shift());
        setTimeout(function () { busy = false; pump(); }, GAP_MS);
      }

      function ready(img) {
        if (img.complete && img.naturalWidth) { queue.push(img); return pump(); }
        img.addEventListener('load', function () { queue.push(img); pump(); }, { once: true });
        img.addEventListener('error', function () { show(img); }, { once: true });
      }

      var io = new IntersectionObserver(function (entries) {
        // Diagonal wave: top-left first
        entries.filter(function (e) { return e.isIntersecting; })
          .sort(function (a, b) {
            return (a.boundingClientRect.top + a.boundingClientRect.left) - (b.boundingClientRect.top + b.boundingClientRect.left);
          })
          .forEach(function (e) { io.unobserve(e.target); ready(e.target); });
      }, { rootMargin: '0px 0px -30px 0px' });
      document.querySelectorAll('.arch img').forEach(function (img) { io.observe(img); });

      // Safety net: if the observer hasn't revealed a cover after a moment
      // (some browsers only report intersections after the first interaction),
      // show it anyway so the windows never stay blank.
      setTimeout(function () {
        document.querySelectorAll('.arch img:not(.shown)').forEach(show);
      }, 1200);

      // The back arrow plays it all in reverse: windows on screen flicker out
      // from the bottom-right, the header fades, then the homepage's text
      // drifts back together.
      var back = document.querySelector('.top a[href="/"]'), leaving = [];
      if (back && back.animate) back.addEventListener('click', function (e) {
        if (e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
        e.preventDefault();
        var H = innerHeight, pos = function (img) { var r = img.getBoundingClientRect(); return r.top + r.left; };
        var onScreen = [].filter.call(document.querySelectorAll('.arch img.shown'), function (img) {
          var r = img.getBoundingClientRect();
          return r.bottom > 0 && r.top < H;
        }).sort(function (a, b) { return pos(b) - pos(a); });
        onScreen.forEach(function (img, i) {
          leaving.push(img);
          setTimeout(function () { img.classList.remove('shown'); }, i * 35);
        });
        document.querySelectorAll('.top').forEach(function (el) {
          leaving.push(el.animate([{ opacity: 0, transform: 'translateY(6px)' }], { duration: 450, delay: 150, easing: 'steps(8, end)', fill: 'forwards' }));
        });
        setTimeout(function () { location.href = back.href; }, onScreen.length * 35 + 650);
      });

      // If this page is restored (e.g. with Forward) after leaving, undo it
      addEventListener('pageshow', function (e) {
        if (!e.persisted || !leaving.length) return;
        leaving.forEach(function (x) { if (x.cancel) x.cancel(); else x.classList.add('shown'); });
        leaving = [];
      });
    } catch (e) {
      root.classList.remove('develop');
    }
  })();
  </script>
</body>
